# ==========================================================
# MDVMounts 1.1.0
# Controlador ligero de monturas para MDVCRAFT.
# ==========================================================
#
# Todas las monturas se controlan por los tags de MDVMounts.
# No hay detección de Disguise ni tratamiento especial por tipo de entidad.
#
# Rendimiento:
# - Sin raytraces ni búsquedas de bloques por tick.
# - MOVEMENT_SPEED y JUMP_STRENGTH se cachean.
# - STEP_HEIGHT se aplica una vez al montar y Minecraft resuelve los escalones.
# - Los cambios de input pueden aplicarse inmediatamente con PlayerInputEvent.
#
# MythicMobs sigue siendo la fuente de verdad para MovementSpeed,
# JumpStrength, vida, skills, modelos, etc.

tags:
  require-base-tag: true
  base: mdv_mount

  ground: mdv_mount_ground
  flying: mdv_mount_flying
  aquatic: mdv_mount_aquatic
  lava: mdv_mount_lava
  jumper: mdv_mount_jumper

control:
  # Pausa la IA/pathfinding vanilla mientras el jugador conduce una montura.
  pause-vanilla-ai-while-ridden: true

  # La entidad gira con la cámara del jinete.
  rotate-mount-with-rider: true

  # Sensación tipo caballo para TODAS las monturas GROUND.
  # Usa STEP_HEIGHT nativo: no busca bloques ni hace raytraces.
  ground-horse-feel:
    enabled: true
    step-height: 1.0

  # Porcentajes de movimiento horizontal por controlador.
  # 100 = MovementSpeed completo; 50 = mitad; 25 = un cuarto.
  movement-percentages:
    ground:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    flying:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    aquatic:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    lava:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    jumper:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

  vertical-speed:
    # Velocidad vertical base de las monturas tridimensionales.
    base-multiplier: 1.5

    # Multiplica la velocidad vertical por JUMP_STRENGTH del mob.
    multiply-by-jump-strength: true

performance:
  # Aplica los cambios W/A/S/D/JUMP desde PlayerInputEvent al recibirlos.
  immediate-input-response: true

  # Refresca MOVEMENT_SPEED y JUMP_STRENGTH cada 10 ticks (0.5 s).
  # No se consultan cada tick.
  attribute-refresh-ticks: 10


# ==========================================================
# ALFORJAS / ALMACENAMIENTO EN EL INVOCADOR
# ==========================================================
#
# Solo los perfiles definidos aquí tienen almacenamiento.
# Cada ItemStack físico recibe un UUID propio al primer uso y guarda sus
# objetos dentro del componente minecraft:container del MISMO item.
# No usa SQLite ni archivos por montura.
#
# Resultado:
# - Silbato A y Silbato B, aunque sean del mismo tipo, tienen inventarios
#   independientes.
# - Si otro jugador roba/recoge el Silbato A, se lleva también sus objetos.
# - El inventario solo abre si la montura INVOCADA por ese ItemStack está
#   cerca. Tener otro silbato igual no permite abrirlo.
# - No hay scans periódicos: las búsquedas solo ocurren al usar el invocador.
#
storage:
  enabled: true

  # Distancia por defecto para abrir las alforjas. Cada perfil puede cambiarla.
  default-interaction-distance: 3.0

  # Tras un click que no abrió almacenamiento, MDVMounts deja que Crucible
  # invoque normalmente y busca durante unos pocos ticks la nueva montura
  # para enlazarla con ESE ItemStack físico.
  bind-search-radius: 4.5
  bind-attempt-delays: [1, 2, 4]

  # Evita meter silbatos con almacenamiento dentro de otro silbato.
  prevent-nested-invokers: true

  profiles:
    caravan:
      enabled: true

      # Slots REALES utilizables: 1 a 54.
      # Si no es múltiplo de 9, los espacios sobrantes de la última fila
      # aparecen bloqueados y no cuentan como almacenamiento.
      slots: 27
      title: '&6Alforjas del Caballo'
      interaction-distance: 3.0

      # Cómo reconocer este tipo de invocador la primera vez.
      # Después queda estampado internamente y sigue siendo el mismo objeto
      # aunque cambie de dueño.
      invoker:
        material: SADDLE
        display-name: '&e&lSilbato de Caravana'

      # El mob correspondiente debe tener TODOS estos scoreboard tags.
      # Para CABALLO_CARAVANA agrega:
      # - addtag{tag=mdv_storage_caravana} @self ~onSpawn
      mount:
        required-tags:
          - mdv_storage_caravana

messages:
  mounted: "&aMontura controlada."
  occupied: "&cEsta montura ya tiene un jinete."
  invalid: "&cEsta entidad no es una montura MDV válida."
  no-permission: "&cNo tienes permiso para usar monturas."
  reloaded: "&aMDVMounts recargado."
  storage-overflow: "&eLa capacidad de esta montura fue reducida; los objetos sobrantes fueron devueltos."
