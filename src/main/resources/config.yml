# ==========================================================
# MDVMounts 1.1.10
# Controlador ligero de monturas para MDVCRAFT.
# ==========================================================
#
# Este archivo contiene movilidad, controles y mensajes generales.
# Los inventarios por invocador viven en storage.yml.
#
# Las configs se auto-actualizan: al iniciar o ejecutar /mdvmounts reload,
# las claves nuevas se agregan sin reemplazar tus valores existentes.
#
# Rendimiento:
# - Las monturas normales no hacen raytraces ni búsquedas de bloques por tick.
# - Solo una montura con mdv_mount_climber hace 1-2 comprobaciones de bloque
#   mientras el jinete intenta moverse contra una pared.
# - MOVEMENT_SPEED y JUMP_STRENGTH se cachean.
# - STEP_HEIGHT se aplica una vez al montar y Minecraft resuelve los escalones.
# - Los cambios de input pueden aplicarse inmediatamente con PlayerInputEvent.

tags:
  require-base-tag: true
  base: mdv_mount

  ground: mdv_mount_ground
  flying: mdv_mount_flying
  aquatic: mdv_mount_aquatic
  lava: mdv_mount_lava
  jumper: mdv_mount_jumper

  # Añadir junto a mdv_mount + mdv_mount_ground para permitir trepar
  # paredes altas como una araña, manteniendo STEP_HEIGHT=1 para escalones.
  climber: mdv_mount_climber

  # Tag independiente para CAMEL vanilla. No requiere mdv_mount:
  # conserva conducción y dos pasajeros vanilla, pero SPACE hace salto normal.
  camel-normal-jump: mdv_mount_camel_normal_jump

  # Protección de caída para el/los pasajeros.
  # Solo se consulta cuando Bukkit ya está procesando daño FALL de un jugador:
  # no crea timers, scans ni trabajo por tick. La montura conserva su propio
  # daño de caída normal.
  rider-fall-protection: mdv_mount_rider_fall_protection

control:
  # Pausa la IA/pathfinding vanilla mientras el jugador conduce una montura.
  pause-vanilla-ai-while-ridden: true

  # La entidad gira con la cámara del jinete.
  rotate-mount-with-rider: true

  # Profundidad máxima que una montura FLYING puede tolerar bajo el agua.
  # Al alcanzar esta profundidad, el jinete se desmonta automáticamente.
  # Solo se comprueba en monturas voladoras que YA están dentro del agua.
  # -1 deshabilita por completo esta restricción.
  flying-mount-max-water-depth: 4

  # Acción usada para abrir el almacenamiento del invocador cuando SU
  # montura está invocada y dentro de la distancia configurada.
  # Opciones: LEFT_CLICK, RIGHT_CLICK, SHIFT_LEFT_CLICK, SHIFT_RIGHT_CLICK
  # LEFT_CLICK conserva el comportamiento actual.
  storage-open-interaction: LEFT_CLICK

  # Acción que Crucible/MythicMobs usa para INVOCAR la montura.
  # Esta opción NO ejecuta la invocación: solo le dice a MDVMounts cuándo
  # preparar el enlace entre el ItemStack físico y la entidad recién creada.
  #
  # Opciones: AUTO, LEFT_CLICK, RIGHT_CLICK, SHIFT_LEFT_CLICK, SHIFT_RIGHT_CLICK
  # AUTO (recomendado) escucha cualquier combinación y solo enlaza si realmente
  # aparece una montura nueva compatible. Así puedes cambiar ~onUse/~onSwing
  # en Crucible sin volver a tocar esta config.
  storage-invocation-interaction: AUTO

  # Habilidad activa de la montura.
  # La skill se toma de un scoreboard tag del mob. Ejemplo:
  #   mdv_mount_skill_TORO_EMBESTIDA
  # al pulsar SPRINT ejecuta la skill MythicMobs TORO_EMBESTIDA con la
  # montura como caster y el jinete como @trigger.
  #
  # input acepta: SPRINT, JUMP, SNEAK, FORWARD, BACKWARD, LEFT, RIGHT.
  # Alias: CTRL/CONTROL = SPRINT, SPACE = JUMP, SHIFT = SNEAK,
  #        W/S/A/D = FORWARD/BACKWARD/LEFT/RIGHT.
  # SPRINT es la acción de sprint de Minecraft: si el jugador cambia la tecla
  # en sus controles, MDVMounts sigue la acción, no una tecla física concreta.
  mount-skills:
    enabled: true
    input: SPRINT
    tag-prefix: mdv_mount_skill_

    # Usa yaw + pitch de la cámara del jinete al lanzar la skill.
    # Esto permite disparar proyectiles hacia arriba/abajo desde monturas
    # voladoras o acuáticas usando @Forward{lockpitch=false}.
    use-rider-look-direction: true

    # Durante cuántos ticks se mantiene sincronizado el pitch del caster con
    # la cámara del jinete. Útil para skills con pulsos/delays cortos.
    rider-look-sync-ticks: 10

    # Si MythicMobs cambia la velocidad de la montura al castear (lunge/dash),
    # MDVMounts no pisa esa velocidad con WASD durante esta ventana.
    # 8 ticks = 0.4 segundos.
    preserve-skill-velocity-ticks: 8

  # CAMEL vanilla con salto normal en lugar del dash.
  # Solo actúa en camellos con el tag tags.camel-normal-jump.
  # El dash vanilla se bloquea en input, HorseJumpEvent y movimiento real.
  # Incluso manteniendo o spameando SPACE, cualquier impulso horizontal
  # anormal de dash se recorta antes de convertirse en desplazamiento.
  # El primer pasajero es el conductor; el segundo sigue siendo pasajero.
  camel-normal-jump:
    enabled: true
    jump-velocity: 0.55

  # Sensación tipo caballo para TODAS las monturas GROUND.
  # Usa STEP_HEIGHT nativo: no busca bloques ni hace raytraces.
  ground-horse-feel:
    enabled: true
    step-height: 1.0

  # Trepado tipo araña para GROUND + tags.climber.
  # Un escalón de 1 bloque sigue resolviéndose con STEP_HEIGHT.
  # En una pared de 2+ bloques, mientras el jinete empuje hacia ella,
  # la montura gana velocidad vertical hasta superar el borde.
  wall-climbing:
    enabled: true
    vertical-speed: 0.22
    probe-distance: 0.12

  # Porcentajes de movimiento horizontal por controlador.
  # 100 = MovementSpeed completo; 50 = mitad; 25 = un cuarto.
  movement-percentages:
    ground:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    flying:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    aquatic:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    lava:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

    jumper:
      forward: 100.0
      backward: 25.0
      lateral: 50.0
      normalize-diagonal: true

  vertical-speed:
    base-multiplier: 1.5
    multiply-by-jump-strength: true

performance:
  # Aplica W/A/S/D/JUMP al recibir PlayerInputEvent.
  immediate-input-response: true

  # Refresca MOVEMENT_SPEED y JUMP_STRENGTH cada 10 ticks (0.5 s).
  attribute-refresh-ticks: 10

messages:
  mounted: "&aMontura controlada."
  occupied: "&cEsta montura ya tiene un jinete."
  invalid: "&cEsta entidad no es una montura MDV válida."
  no-permission: "&cNo tienes permiso para usar monturas."
  reloaded: "&aMDVMounts recargado."
