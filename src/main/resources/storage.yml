# ==========================================================
# MDVMounts 1.1.13 - ALMACENAMIENTO DE MONTURAS
# ==========================================================
#
# La acción para abrir el almacenamiento se elige en config.yml:
#   control.storage-open-interaction
#
# Por defecto sigue siendo LEFT_CLICK. El click derecho que no sea consumido
# por una apertura continúa disponible para Crucible/MythicMobs y el enlace.
#
# Cada ItemStack físico tiene su propio minecraft:container.
# MDVMounts oculta el componente CONTAINER del tooltip para que Minecraft no
# muestre la lista de objetos almacenados sobre el lore del silbato.
# El UUID de enlace se renueva en cada invocación exitosa para evitar que
# dos copias físicas de un invocador compartan accidentalmente identidad.
# Si el silbato cambia de dueño, sus objetos viajan con él.
# Solo una persona puede visualizar un mismo almacenamiento a la vez.
# Si la montura muere, despawnea o es removida, el menú se cierra.
#
# Este archivo también se auto-actualiza: se agregan claves nuevas sin
# reemplazar valores ni perfiles personalizados existentes.

enabled: true

# Distancia por defecto para abrir el almacenamiento.
default-interaction-distance: 3.0

# Tras un click derecho de invocación, busca por unos pocos ticks la nueva
# montura compatible para enlazarla con ESE ItemStack físico.
bind-search-radius: 4.5
bind-attempt-delays: [1, 2, 4]

# Evita guardar invocadores con almacenamiento dentro de otro invocador.
prevent-nested-invokers: true

profiles:
  caravan:
    enabled: true

    # MODO NORMAL (sin paginación):
    # Slots REALES utilizables, de 1 a 54.
    slots: 27

    # MODO PAGINADO (opcional):
    # Si agregas "pages", esta lista reemplaza a "slots" para ese perfil.
    # Debe tener al menos 2 páginas.
    # - Todas las páginas excepto la última deben ser de 54.
    # - La última puede ser 9, 18, 27, 36, 45 o 54.
    # - Cada página reserva 2 casillas: esquina inferior izquierda/derecha
    #   para Página anterior / Página siguiente.
    #
    # Ejemplos de capacidad ÚTIL:
    # pages: [54, 9]      -> 52 + 7  = 59 slots
    # pages: [54, 27]     -> 52 + 25 = 77 slots
    # pages: [54, 54]     -> 52 + 52 = 104 slots
    # pages: [54, 54, 27] -> 52 + 52 + 25 = 129 slots
    #
    # minecraft:container admite como máximo 256 entradas; MDVMounts valida
    # la suma al recargar y omite perfiles paginados inválidos.
    # pages: [54, 27]

    title: '&6Alforjas del Caballo'
    interaction-distance: 3.0

    invoker:
      material: SADDLE
      display-name: '&e&lSilbato de Caravana'

    # El mob invocado debe tener TODOS estos scoreboard tags.
    mount:
      required-tags:
        - mdv_storage_caravana

messages:
  storage-in-use: '&cEse almacenamiento ya está siendo utilizado por otra persona.'
  storage-mount-gone: '&eEl almacenamiento se cerró porque tu montura desapareció.'
  storage-overflow: '&eLa capacidad de esta montura fue reducida; los objetos sobrantes fueron devueltos.'
