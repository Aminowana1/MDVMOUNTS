name: MDVMounts
version: '1.1.16'
main: com.mdvcraft.mdvmounts.MDVMountsPlugin
api-version: '1.21.6'
author: MDVCRAFT
description: Controlador de monturas por tags para MythicMobs, sin velocidad propia.
softdepend: [MythicMobs, floodgate, Geyser-Spigot]

commands:
  mdvmounts:
    description: Administración de MDVMounts.
    usage: /mdvmounts <reload|status>
    permission: mdvmounts.admin

permissions:
  mdvmounts.use:
    description: Permite montar entidades marcadas para MDVMounts.
    default: true
  mdvmounts.admin:
    description: Permite administrar MDVMounts.
    default: op
