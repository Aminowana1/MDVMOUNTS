name: Build MDVMounts

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  compatibility:
    name: Compile against Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 1.21.6-R0.1-SNAPSHOT
          - 1.21.11-R0.1-SNAPSHOT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify source compatibility
        run: mvn -B -Dpaper.version=${{ matrix.paper }} clean verify

  build:
    name: Build universal 1.21.6+ jar
    runs-on: ubuntu-latest
    needs: compatibility

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El JAR final se compila contra la API mínima soportada (1.21.6).
      # Como MDVMounts no usa NMS, ese mismo JAR está pensado para las
      # revisiones 1.21.x posteriores que conserven estas APIs.
      - name: Package
        run: mvn -B -Dpaper.version=1.21.6-R0.1-SNAPSHOT clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MDVMounts-jar
          path: target/MDVMounts-*.jar
          if-no-files-found: error
